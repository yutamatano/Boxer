name: Boxer CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CPU tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install OpenGL runtime libraries and video tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libegl1 libxkbcommon0 ffmpeg

      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .github/requirements-ci.txt
          python -m pip check

      - name: Check syntax and run tests
        run: bash scripts/ci.sh

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cpu-test-results
          path: |
            output/ci/junit.xml
            output/ci/pytest.log
          if-no-files-found: ignore
          retention-days: 14
